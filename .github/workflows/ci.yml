name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: |
          if [ -d tests ]; then pytest -q; else echo "no tests/ yet"; fi

  docker:
    # Image build is slow: only check it on PRs into main.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t agent:ci .

      - name: Check image size < 4 GB
        run: |
          size=$(docker image inspect agent:ci --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MB"
          [ "$size" -lt $((4 * 1024 * 1024 * 1024)) ]
