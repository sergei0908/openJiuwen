name: CI

on:
  # Every PR, including PRs stacked on another feature branch.
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: |
          if [ -d tests ]; then pytest -q; else echo "no tests/ yet"; fi

  docker:
    # Build the image on every PR: a broken image means disqualification.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (jury limit 1000 s)
        timeout-minutes: 16
        run: docker build -t agent:ci .

      - name: Check image size < 4 GB
        run: |
          size=$(docker image inspect agent:ci --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MB"
          [ "$size" -lt $((4 * 1024 * 1024 * 1024)) ]

      - name: Smoke test with jury flags and no network
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=2g -e HOME=/tmp \
            --cap-drop ALL --security-opt no-new-privileges --workdir /tmp \
            --entrypoint python agent:ci -c "
          import sys; sys.path.insert(0, '/app')
          from harness.llm import LLM, Ledger
          backend = LLM(Ledger())._backend
          print('LLM backend:', backend)
          assert backend == 'openjiuwen', 'openJiuwen failed to import inside the image'
          "

      - name: Run the harness end-to-end on example tasks (jury flags, no network, no key)
        run: IMAGE=agent:ci tools/jury_run.sh examples/tasks
